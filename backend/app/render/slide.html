<!DOCTYPE html>
<html lang="{lang}" dir="{dir}">
<head>
<meta charset="utf-8">
<style>
{font_faces}
:root {{
  --navy: {navy}; --gold: {gold}; --gold-light: {gold_light};
  --card-bg: {card_bg}; --card-solid: {card_solid}; --card-title: {card_title}; --card-text: {card_text}; --card-heading: {card_heading};
  --navy-rgb: {navy_rgb}; --plate-rgb: {plate_rgb};
}}
* {{ box-sizing: border-box; margin: 0; padding: 0; }}
html, body {{ width: 1080px; height: 1350px; overflow: hidden; }}
body {{ font-family: {font}; background: var(--navy); color: #fff; position: relative; }}
.bg {{ position: absolute; inset: 0; background-size: cover; background-position: {bg_pos}; {bg_filter} }}
.shade {{ position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(var(--navy-rgb),.55) 0%, rgba(var(--navy-rgb),0) 22%, rgba(var(--navy-rgb),0) 45%, rgba(var(--navy-rgb),.80) 100%); }}
.top {{ position: absolute; top: 56px; left: 64px; right: 64px; display: flex; align-items: center;
  justify-content: space-between; flex-direction: {top_dir}; }}
.logo {{ display: inline-flex; align-items: center; }}
.logo img {{ height: 84px; width: auto; display: block;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(0,0,0,.35)); }}
/* Navy plate behind the logo when the photo is bright there (decided per slide) */
.logo.plate {{ background: rgba(var(--plate-rgb), .86); padding: 14px 24px; border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22); backdrop-filter: blur(6px); }}
.logo.plate img {{ filter: none; }}
.logo .wordmark {{ font-weight: 900; font-size: 44px; color: #fff; letter-spacing: 0;
  text-shadow: 0 2px 4px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); }}
.logo.plate .wordmark {{ text-shadow: none; }}
.logo .wordmark span {{ color: var(--gold); }}
.badge {{ background: var(--gold); color: var(--navy); font-weight: 800; font-size: 30px; padding: 10px 30px;
  border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }}
.card {{ position: absolute; left: 64px; right: 64px; bottom: 150px; padding: 56px 60px; border-radius: 40px; }}
.card.frosted {{ background: var(--card-bg); backdrop-filter: blur(18px); color: var(--card-text); box-shadow: 0 20px 60px rgba(0,0,0,.28); }}
.card.solid {{ background: var(--navy); color: #fff; border-top: 10px solid var(--gold); }}
.card.minimal {{ background: transparent; padding: 0; color: #fff; text-shadow: 0 3px 16px rgba(0,0,0,.55); }}
/* Band: full-width navy band across the bottom, gold edge on top */
.card.band {{ left: 0; right: 0; bottom: 0; border-radius: 0; padding: 64px 72px 150px;
  background: var(--card-bg); color: var(--card-text); border-top: 12px solid var(--gold);
  box-shadow: 0 -10px 40px rgba(0,0,0,.18); }}
.card.band ~ .footer, .card.band ~ .footer .credit {{ color: var(--card-text); text-shadow: none; }}
.card.band ~ .footer .handle {{ color: var(--card-heading); }}
.card.band ~ .footer .dots i {{ background: rgba(var(--navy-rgb),.25); }}
.card.band ~ .footer .dots i.on {{ background: var(--gold); }}
/* Side: tall glass panel on the reading side, photo stays visible on the other */
.card.side {{ top: 170px; bottom: 130px; left: auto; right: auto; inset-inline-start: 0; width: 64%;
  border-radius: 0; border-start-end-radius: 44px; border-end-end-radius: 44px;
  padding: 70px 60px; display: flex; flex-direction: column; justify-content: center;
  background: rgba(255,255,255,.88); backdrop-filter: blur(12px); color: var(--card-text);
  border-inline-end: 12px solid var(--gold); box-shadow: 0 20px 60px rgba(0,0,0,.22); }}
/* Ribbon: heading set on gold ribbons, text on a dark glass block */
.card.ribbon {{ background: transparent; padding: 0; color: #fff; }}
.card.ribbon h1, .card.ribbon h2 {{ display: inline; background: var(--gold); color: var(--navy) !important;
  padding: 4px 22px; line-height: 1.75; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  border-radius: 10px; }}
.card.ribbon p {{ margin-top: 30px; background: var(--card-bg); color: var(--card-text); padding: 30px 36px;
  border-radius: 26px; box-shadow: 0 16px 44px rgba(0,0,0,.22); }}
.card.ribbon .accent {{ display: none; }}
/* Outline: dark glass with a gold frame */
.card.outline {{ background: rgba(255,255,255,.90); backdrop-filter: blur(14px); color: var(--card-text);
  border: 5px solid var(--gold); outline: 3px solid rgba(255,255,255,.75); outline-offset: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,.22); }}
.accent {{ width: 96px; height: 10px; border-radius: 10px; background: var(--gold); margin-bottom: 30px; }}
h1 {{ font-weight: 900; line-height: 1.35; }}
.card.frosted h1 {{ color: var(--card-title); }}
.card.solid h1, .card.minimal h1 {{ color: #fff; }}
.card.band h1, .card.side h1, .card.outline h1 {{ color: var(--card-title); }}
.card.band h2, .card.side h2, .card.outline h2 {{ color: var(--card-heading); }}
h2 {{ font-weight: 800; line-height: 1.4; color: var(--gold); margin-bottom: 22px; }}
.card.frosted h2 {{ color: var(--card-heading); }}
p {{ line-height: 1.85; font-weight: 600; }}
.subtitle {{ margin-top: 24px; font-weight: 600; opacity: .9; }}
.footer {{ position: absolute; left: 64px; right: 64px; bottom: 56px; display: flex; justify-content: space-between;
  align-items: center; font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); }}
.footer .handle {{ color: var(--gold-light); direction: ltr; unicode-bidi: isolate; }}
.footer .credit {{ opacity: .85; font-weight: 600; font-size: 24px; }}
.dots {{ display: flex; gap: 10px; }}
.dots i {{ width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.45); display: block; }}
.dots i.on {{ background: var(--gold); width: 38px; border-radius: 10px; }}
/* CTA */
.cta-wrap {{ position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 120px 100px; }}
.cta-wrap .ring {{ width: 140px; height: 140px; border-radius: 50%; border: 6px solid var(--gold);
  display: flex; align-items: center; justify-content: center; margin-bottom: 56px; font-size: 70px; color: var(--gold); }}
.cta-logo {{ margin-bottom: 56px; display: flex; flex-direction: column; align-items: center; }}
.cta-logo .logo img {{ height: 220px; max-width: 760px; object-fit: contain; }}
.cta-logo .logo .wordmark {{ font-size: 110px; line-height: 1.1; }}
.cta-logo::after {{ content: ""; width: 140px; height: 7px; border-radius: 6px; background: var(--gold); margin-top: 40px; }}
.cta-wrap h1 {{ color: #fff; margin-bottom: 40px; }}
.cta-wrap .button {{ margin-top: 30px; background: var(--gold); color: var(--navy); font-weight: 900; font-size: 42px;
  padding: 22px 64px; border-radius: 999px; direction: ltr; unicode-bidi: isolate; }}
.cta-wrap .site {{ margin-top: 36px; font-size: 34px; color: var(--gold-light); direction: ltr; font-weight: 700; }}
/* Last slide: the photo stays visible under a brand-navy shade */
.cta-overlay {{ position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 55% at center, rgba(var(--navy-rgb), .72) 0%, rgba(var(--navy-rgb), .40) 60%, rgba(var(--navy-rgb), .12) 100%),
              linear-gradient(180deg, rgba(var(--navy-rgb), 0) 55%, rgba(var(--navy-rgb), .45) 100%); }}
.cta-wrap h1, .cta-wrap p {{ text-shadow: 0 3px 18px rgba(0,0,0,.45); }}
/* ---------------- Magazine theme: bold, modern, built to stop the scroll ---------------- */
.m-shade {{ position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(var(--navy-rgb),.45) 0%, rgba(var(--navy-rgb),0) 18%,
    rgba(var(--navy-rgb),0) 38%, rgba(var(--navy-rgb),.78) 66%, rgba(var(--navy-rgb),.96) 100%); }}
.m-cover {{ position: absolute; left: 72px; right: 72px; bottom: 170px; color: #fff; }}
.m-kicker {{ display: flex; align-items: center; gap: 16px; color: var(--gold-light); font-size: 32px; font-weight: 800;
  margin-bottom: 22px; letter-spacing: .5px; }}
.m-kicker i {{ width: 64px; height: 6px; border-radius: 6px; background: var(--gold); display: block; }}
.m-cover h1 {{ font-size: 92px; line-height: 1.22; font-weight: 900; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.35); }}
.m-cover h1 mark {{ background: none; color: var(--gold-light); position: relative; white-space: nowrap; }}
.m-cover h1 mark::after {{ content: ""; position: absolute; left: 0; right: 0; bottom: .06em; height: .16em;
  background: var(--gold); opacity: .55; border-radius: 6px; z-index: -1; }}
.m-sub {{ margin-top: 26px; font-size: 38px; font-weight: 600; line-height: 1.6; color: rgba(255,255,255,.92); }}
.m-bar {{ position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; align-items: center;
  justify-content: space-between; gap: 20px; font-size: 28px; font-weight: 700; color: #fff; }}
.m-bar .handle {{ color: var(--gold-light); direction: ltr; unicode-bidi: isolate; }}
.m-credit {{ font-size: 24px; opacity: .8; font-weight: 600; }}
.m-swipe {{ background: var(--gold); color: var(--navy); padding: 14px 30px; border-radius: 999px; font-weight: 900;
  font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.25); white-space: nowrap; }}
.m-swipe b {{ font-size: 34px; margin-inline-start: 6px; }}
/* content slide: photo on top, bright panel below with a big numbered tip */
.m-photo {{ position: absolute; left: 0; right: 0; top: 0; height: 640px; overflow: hidden; }}
.m-photo .bg {{ position: absolute; inset: 0; }}
.m-photo-shade {{ position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(var(--navy-rgb),.45) 0%, rgba(var(--navy-rgb),0) 30%, rgba(var(--navy-rgb),.15) 100%); }}
.m-panel {{ position: absolute; left: 0; right: 0; top: 580px; bottom: 0; background: var(--card-bg);
  border-radius: 56px 56px 0 0; padding: 120px 76px 0; box-shadow: 0 -18px 50px rgba(0,0,0,.18); }}
.m-num {{ position: absolute; top: -78px; left: 76px; width: 156px; height: 156px; border-radius: 50%;
  background: var(--navy); color: var(--gold-light); display: flex; align-items: center; justify-content: center;
  font-size: 66px; font-weight: 900; border: 8px solid var(--card-bg); box-shadow: 0 12px 30px rgba(0,0,0,.25);
  direction: ltr; }}
html[dir="rtl"] .m-num {{ left: auto; right: 76px; }}
.m-body h2 {{ font-size: 66px; font-weight: 900; line-height: 1.3; color: var(--card-title); margin-bottom: 22px; }}
.m-body h2::after {{ content: ""; display: block; width: 110px; height: 8px; border-radius: 8px; background: var(--gold);
  margin-top: 20px; }}
.m-body p {{ font-size: 46px; line-height: 1.7; font-weight: 600; color: var(--card-text); }}
.m-foot {{ position: absolute; left: 76px; right: 76px; bottom: 58px; display: flex; justify-content: space-between;
  align-items: center; font-size: 28px; font-weight: 800; color: var(--card-heading); }}
.m-foot .handle {{ direction: ltr; unicode-bidi: isolate; }}
.m-count {{ color: var(--card-title); direction: ltr; }}
.m-progress {{ position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: rgba(var(--navy-rgb),.10); }}
.m-progress i {{ display: block; height: 100%; background: var(--gold); border-start-end-radius: 12px; border-end-end-radius: 12px; }}
/* last slide extras */
.m-actions {{ display: flex; gap: 22px; margin-top: 46px; }}
.m-act {{ display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; font-size: 30px;
  font-weight: 800; color: #fff; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.45);
  backdrop-filter: blur(6px); }}
.m-act svg {{ width: 34px; height: 34px; fill: var(--gold-light); }}
.theme-magazine .cta-wrap {{ padding: 100px 90px; }}
.m-bar.dark {{ color: var(--card-title); }}
.m-bar.dark .handle {{ color: var(--card-heading); }}
.m-bar.dark .m-credit {{ color: var(--card-text); }}
/* ---- photo-first creative layouts: the photo stays the hero, text sits in a compact shape ---- */
.ph-shade {{ position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(var(--navy-rgb),.40) 0%, rgba(var(--navy-rgb),0) 18%, rgba(var(--navy-rgb),0) 55%, rgba(var(--navy-rgb),.35) 100%); }}
/* sizes in em so the auto-fit can shrink long texts */
[class^="L2-"] .m-body {{ font-size: 52px; }}
[class^="L2-"] .m-body h2 {{ font-size: 1em; margin-bottom: 14px; }}
[class^="L2-"] .m-body h2::after {{ width: 90px; height: 7px; margin-top: 14px; }}
[class^="L2-"] .m-body p {{ font-size: .7em; line-height: 1.65; }}
.theme-magazine .m-foot {{ color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); bottom: 46px; }}
.theme-magazine .m-foot .handle {{ color: var(--gold-light); }}
.theme-magazine .m-count {{ color: #fff; }}
.theme-magazine .m-progress {{ background: rgba(255,255,255,.25); height: 10px; }}
/* panel: floating card in the lower third */
.L2-panel {{ position: absolute; left: 56px; right: 56px; bottom: 110px; background: var(--card-bg); border-radius: 44px;
  padding: 84px 60px 44px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }}
.L2-panel .m-num {{ top: -70px; width: 132px; height: 132px; font-size: 56px; border-width: 7px; }}
html[dir="rtl"] .L2-panel .m-num {{ right: 56px; }}
/* arch: small poster arch, centred */
.L2-arch {{ position: absolute; left: 150px; right: 150px; bottom: 110px; background: var(--card-bg);
  border-radius: 400px 400px 34px 34px; padding: 150px 56px 44px; text-align: center;
  outline: 5px solid var(--gold); outline-offset: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }}
.L2-arch .m-body h2::after {{ margin: 14px auto 0; }}
.L2-arch .arch-num {{ position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 104px; height: 104px;
  border-radius: 50%; background: var(--navy); color: var(--gold-light); font-size: 46px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; direction: ltr; }}
/* ticket: compact boarding pass */
.L2-ticket {{ position: absolute; left: 56px; right: 56px; bottom: 110px; background: #fff; border-radius: 30px;
  box-shadow: 0 24px 60px rgba(0,0,0,.28);
  -webkit-mask: radial-gradient(circle 28px at 0 118px, transparent 27px, #000 28px) left / 51% 100% no-repeat,
                radial-gradient(circle 28px at 100% 118px, transparent 27px, #000 28px) right / 51% 100% no-repeat; }}
.L2-ticket .tk-head {{ height: 118px; background: var(--navy); border-radius: 30px 30px 0 0; display: flex; align-items: center;
  justify-content: space-between; padding: 0 50px; color: #fff; border-bottom: 4px dashed rgba(255,255,255,.35); }}
.L2-ticket .tk-plane {{ font-size: 50px; color: var(--gold-light); }}
.L2-ticket .tk-label {{ font-size: 30px; font-weight: 800; letter-spacing: 2px; }}
.L2-ticket .tk-seat {{ font-size: 60px; font-weight: 900; color: var(--gold-light); direction: ltr; }}
.L2-ticket .tk-text {{ padding: 34px 56px 40px; }}
/* note: taped paper, slightly tilted */
.L2-note {{ position: absolute; left: 90px; right: 90px; bottom: 120px; background: #FFFDF6; padding: 70px 56px 44px;
  transform: rotate(-2deg); box-shadow: 0 24px 56px rgba(0,0,0,.28); border-bottom: 10px solid var(--gold); }}
.L2-note .tape {{ position: absolute; width: 170px; height: 48px; background: var(--gold); opacity: .8; top: -22px; }}
.L2-note .tape.t1 {{ left: -30px; transform: rotate(-28deg); }}
.L2-note .tape.t2 {{ right: -30px; transform: rotate(28deg); }}
.L2-note .note-num {{ position: absolute; top: 14px; font-size: 44px; font-weight: 900; color: var(--card-heading); direction: ltr; }}
html[dir="rtl"] .L2-note .note-num {{ left: 56px; }}
html[dir="ltr"] .L2-note .note-num {{ right: 56px; }}
/* wave: bottom wave, photo above stays visible */
.L2-wave {{ position: absolute; left: 0; right: 0; bottom: 0; background: var(--card-solid); padding: 30px 76px 130px; }}
.L2-wave svg {{ position: absolute; left: 0; right: 0; top: -118px; width: 100%; height: 120px; fill: var(--card-solid); }}
.L2-wave .wave-num {{ position: absolute; top: -150px; font-size: 170px; font-weight: 900; line-height: 1; color: transparent;
  -webkit-text-stroke: 5px var(--gold); direction: ltr; }}
html[dir="rtl"] .L2-wave .wave-num {{ right: 76px; }}
html[dir="ltr"] .L2-wave .wave-num {{ left: 76px; }}
.L2-wave ~ .m-foot {{ color: var(--card-title); text-shadow: none; }}
.L2-wave ~ .m-foot .handle {{ color: var(--card-heading); }}
.L2-wave ~ .m-foot .m-count {{ color: var(--card-title); }}
/* leaf: card with two rounded corners and a gold medal */
.L2-leaf {{ position: absolute; left: 56px; right: 56px; bottom: 110px; background: var(--card-bg);
  border-radius: 90px 18px 90px 18px; padding: 56px 60px 44px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }}
.L2-leaf .leaf-num {{ position: absolute; top: -64px; width: 128px; height: 128px; border-radius: 50%; background: var(--gold);
  color: var(--navy); font-size: 54px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  border: 7px solid #fff; box-shadow: 0 10px 26px rgba(0,0,0,.25); direction: ltr; }}
html[dir="rtl"] .L2-leaf .leaf-num {{ left: 70px; }}
html[dir="ltr"] .L2-leaf .leaf-num {{ right: 70px; }}
/* Cover: postage stamp on a postcard */
.C-stamp {{ position: absolute; inset: 0; background: var(--card-solid);
  background-image: repeating-linear-gradient(-45deg, rgba(var(--navy-rgb),.035) 0 22px, transparent 22px 44px); }}
.stamp {{ position: absolute; left: 70px; right: 70px; top: 130px; height: 760px; background: #fff; padding: 22px;
  transform: rotate(-2deg); box-shadow: 0 24px 60px rgba(0,0,0,.2);
  -webkit-mask: radial-gradient(circle 13px, transparent 12px, #000 13px) -20px -20px / 40px 40px,
                linear-gradient(#000 0 0) center / calc(100% - 36px) calc(100% - 36px) no-repeat; }}
.stamp-photo {{ position: relative; width: 100%; height: 100%; overflow: hidden; }}
.stamp-photo .bg {{ position: absolute; inset: 0; }}
.postmark {{ position: absolute; top: 760px; left: 50px; width: 180px; height: 180px; border-radius: 50%;
  border: 6px solid var(--navy); color: var(--navy); display: flex; flex-direction: column; align-items: center;
  justify-content: center; transform: rotate(-14deg); background: rgba(255,255,255,.55); font-weight: 900; }}
.postmark span {{ font-size: 40px; letter-spacing: 2px; }}
.postmark small {{ font-size: 22px; letter-spacing: 6px; color: var(--card-heading); }}
html[dir="ltr"] .postmark {{ left: auto; right: 80px; }}
.stamp-title {{ position: absolute; left: 76px; right: 76px; top: 935px; color: var(--card-title); }}
.stamp-title, .diag-title {{ font-size: 66px; }}
.stamp-title .m-kicker, .diag-title .m-kicker {{ font-size: .45em; margin-bottom: 12px; }}
.stamp-title h1, .diag-title h1 {{ font-size: 1em; line-height: 1.22; font-weight: 900; color: var(--card-title); }}
.stamp-title h1 mark, .diag-title h1 mark {{ background: none; color: var(--card-heading); position: relative; white-space: nowrap; }}
.stamp-title h1 mark::after, .diag-title h1 mark::after {{ content: ""; position: absolute; left: 0; right: 0; bottom: .06em;
  height: .2em; background: var(--gold); opacity: .45; border-radius: 6px; z-index: -1; }}
.stamp-title .m-sub, .diag-title .m-sub {{ color: var(--card-text); font-size: .5em; margin-top: 12px; }}
.stamp-title .m-kicker, .diag-title .m-kicker {{ color: var(--card-heading); }}
/* Cover: diagonal gold band */
.C-diag {{ position: absolute; inset: 0; }}
.diag-gold {{ position: absolute; inset: 0; background: var(--gold); clip-path: polygon(0 66%, 100% 56%, 100% 61%, 0 71%); }}
.diag-band {{ position: absolute; inset: 0; background: var(--card-solid); clip-path: polygon(0 71%, 100% 61%, 100% 100%, 0 100%);
  box-shadow: 0 -10px 30px rgba(0,0,0,.2); }}
.diag-title {{ position: absolute; left: 76px; right: 76px; top: 900px; }}
{extra_css}
</style>
</head>
<body class="{theme}">
{content}
<script>
// Shrink text until the card fits in the available space.
function fit(el, maxH, minSize) {{
  if (!el) return;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollHeight > maxH && size > minSize) {{ size -= 2; el.style.fontSize = size + 'px'; }}
}}
document.querySelectorAll('[data-fit]').forEach(el => {{
  const [maxH, minSize] = el.dataset.fit.split(',').map(Number);
  fit(el, maxH, minSize);
}});
document.body.dataset.ready = '1';
</script>
</body>
</html>
